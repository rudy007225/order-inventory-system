# ─── Server ───────────────────────────────────────
server:
  port: 8080

# ─── Database ─────────────────────────────────────
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/oms_db
    username: root
    password: root@1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ─── JPA / Hibernate ────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ─── Security (temporary — UC2 adds proper config)
  security:
    user:
      name: admin
      password: admin123

# ─── Logging ──────────────────────────────────────
logging:
  level:
    com.oms: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# ─── Swagger ──────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs